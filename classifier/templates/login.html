<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Paperless Classifier</title><link rel="stylesheet" href="/static/style.css"><script src="/static/login.js" defer></script></head>
<body class="login-page"><main class="login-card"><div class="brand-mark" aria-hidden="true">▤</div><p class="eyebrow">PAPERLESS CLASSIFIER</p><h1>A place for every document.</h1><p class="muted">Sign in with the Paperless account connected to this app.</p>
<form id="login-form"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Sign in</button></form>
<details><summary>Use a Paperless API token instead</summary><form id="token-form"><label>API token<input name="token" type="password" autocomplete="off" required></label><button type="submit">Connect</button></form></details><p id="login-error" role="alert" class="error-text"></p><p class="fine-print">Your password is verified by Paperless and is never saved here.</p></main></body></html>
